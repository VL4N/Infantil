name: Licencias de voces (temporal)

# Muestra la ficha (MODEL_CARD) de las voces de Piper candidatas, para elegir
# solo las que permiten uso comercial. Se borrará después.
on:
  push:
    branches: [ccr-2327e729-ouzsfc]
    paths: [.github/workflows/voces-licencias.yml]

jobs:
  licencias:
    runs-on: ubuntu-latest
    steps:
      - run: |
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main
          for v in es/es_MX/claude/high es/es_MX/ald/medium es/es_AR/daniela/high es/es_ES/davefx/medium \
                   en/en_US/hfc_female/medium en/en_US/amy/medium en/en_US/kristin/medium \
                   en/en_US/libritts_r/medium en/en_US/ljspeech/high en/en_US/lessac/high; do
            echo "=================== $v ==================="
            curl -sfL "$base/$v/MODEL_CARD" || echo "(sin MODEL_CARD)"
            echo
          done
