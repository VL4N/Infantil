name: Muestras de voces (temporal)
on:
  push:
    branches: [ccr-2327e729-ouzsfc]
    paths: ['tool/muestras_voces.py', '.github/workflows/muestras-voces.yml']
permissions:
  contents: write
jobs:
  muestras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install --quiet piper-tts
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main
          mkdir -p modelos muestras-voz
          for v in en/en_US/ljspeech/high en/en_US/lessac/high en/en_US/hfc_female/medium en/en_US/amy/medium \
                   en/en_US/kristin/medium en/en_US/ryan/high en/en_US/libritts_r/medium en/en_GB/cori/high \
                   en/en_GB/jenny_dioco/medium es/es_MX/claude/high; do
            n=$(basename $(dirname $(dirname $v)))-$(basename $(dirname $v))-$(basename $v)
            curl -sfL -o "modelos/$n.onnx" "$base/$v/$n.onnx" && curl -sfL -o "modelos/$n.onnx.json" "$base/$v/$n.onnx.json" || { echo "falta $n"; rm -f modelos/$n.onnx*; }
            { echo "=== $n"; curl -sfL "$base/$v/MODEL_CARD"; echo; } >> muestras-voz/LICENCIAS.txt
          done
          python tool/muestras_voces.py modelos muestras-voz
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add muestras-voz
          git commit -m "Muestras de voces en inglés (temporal)"
          git push
