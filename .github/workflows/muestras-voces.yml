name: Muestras de voces (temporal)
on:
  push:
    branches: [ccr-2327e729-ouzsfc]
    paths: ['tool/muestras_mono.py', '.github/workflows/muestras-voces.yml']
permissions:
  contents: write
jobs:
  muestras:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install --quiet imageio-ffmpeg && mkdir -p bin && ln -sf "$(python -c 'import imageio_ffmpeg as f; print(f.get_ffmpeg_exe())')" bin/ffmpeg && export PATH="$PWD/bin:$PATH"
          pip install --quiet piper-tts
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_MX/claude/high
          mkdir -p modelos muestras-voz
          curl -sfL -o modelos/es.onnx "$base/es_MX-claude-high.onnx"
          curl -sfL -o modelos/es.onnx.json "$base/es_MX-claude-high.onnx.json"
          python tool/muestras_mono.py modelos/es.onnx muestras-voz
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add muestras-voz
          git commit -m "Muestras de \"mono\" (temporal)"
          git pull --rebase -q
          git push
