name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Si llega un cambio nuevo a la misma rama, se cancela la compilación anterior
# (ya no sirve) para no gastar minutos de GitHub.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      # Voz de la app: graba con Piper todas las frases (lib/logic/phrases.dart).
      # Los audios se guardan en caché y solo se graban las frases nuevas.
      - name: Lista de frases
        id: frases
        run: |
          dart run tool/export_phrases.dart > frases.tsv
          echo "Frases: $(wc -l < frases.tsv)"
          echo "hash=$(sha256sum frases.tsv | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: assets/voz
          key: voz-v1-claude-ljspeech-${{ steps.frases.outputs.hash }}
          restore-keys: voz-v1-claude-ljspeech-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Grabar frases con Piper
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install --quiet piper-tts
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main
          mkdir -p modelos
          # Español: es_MX "claude" (Apache-2.0). Inglés: en_US "ljspeech" (dominio público).
          for f in es/es_MX/claude/high/es_MX-claude-high en/en_US/ljspeech/high/en_US-ljspeech-high; do
            curl -sfL -o "modelos/$(basename $f).onnx" "$base/$f.onnx"
            curl -sfL -o "modelos/$(basename $f).onnx.json" "$base/$f.onnx.json"
          done
          python tool/generar_voces.py frases.tsv modelos/es_MX-claude-high.onnx modelos/en_US-ljspeech-high.onnx assets/voz
          echo "Audios: $(ls assets/voz/*.mp3 | wc -l), tamaño: $(du -sh assets/voz | cut -f1)"
          test "$(ls assets/voz/*.mp3 | wc -l)" -eq "$(wc -l < frases.tsv)"
      - run: flutter analyze
      - run: flutter test
      # APK de prueba (firmado con clave de depuración) para instalar en el teléfono.
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk AprendeJugando.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aprende-jugando-apk
          path: AprendeJugando.apk
      # En la rama principal, publica el APK como versión descargable:
      # https://github.com/VL4N/Infantil/releases/latest
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Versión de prueba ${{ github.run_number }}
          body: |
            APK de prueba para instalar en un teléfono Android.
            Descarga **AprendeJugando.apk** y ábrelo en el teléfono (permite "instalar apps de origen desconocido").
          files: AprendeJugando.apk
          make_latest: true
      # Deja solo la versión recién publicada: borra las anteriores para no confundir.
      - if: github.ref == 'refs/heads/main'
        name: Borrar versiones de prueba anteriores
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep '^build-' | grep -vx "build-${{ github.run_number }}" \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
