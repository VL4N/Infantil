name: Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # APK de prueba (firmado con clave de depuración) para instalar en el teléfono.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: aprende-jugando-apk
          path: build/app/outputs/flutter-apk/app-release.apk
