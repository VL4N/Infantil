name: Android APK

# Solo en la rama principal (o a mano): las ramas de trabajo se prueban antes con
# `flutter analyze` y `flutter test`, y así no se gastan minutos compilando dos veces.
on:
  push:
    branches: [main]
    # Cambios solo en textos o en la página de privacidad no necesitan un APK nuevo.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

# Si llega un cambio nuevo a la misma rama, se cancela la compilación anterior
# (ya no sirve) para no gastar minutos de GitHub.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Voz de la app: graba con Piper todas las frases (lib/logic/phrases.dart).
      # Los audios se guardan en caché y solo se graban las frases nuevas.
      - name: Lista de frases
        id: frases
        run: |
          dart run tool/export_phrases.dart > frases.tsv
          echo "Frases: $(wc -l < frases.tsv)"
          echo "hash=$(sha256sum frases.tsv | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: assets/voz
          key: voz-v2-claude-ljspeech-${{ steps.frases.outputs.hash }}
          restore-keys: voz-v2-claude-ljspeech-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Grabar frases con Piper
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install --quiet piper-tts
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main
          mkdir -p modelos
          # Español: es_MX "claude" (Apache-2.0). Inglés: en_US "ljspeech" (dominio público).
          for f in es/es_MX/claude/high/es_MX-claude-high en/en_US/ljspeech/high/en_US-ljspeech-high; do
            curl -sfL -o "modelos/$(basename $f).onnx" "$base/$f.onnx"
            curl -sfL -o "modelos/$(basename $f).onnx.json" "$base/$f.onnx.json"
          done
          python tool/generar_voces.py frases.tsv modelos/es_MX-claude-high.onnx modelos/en_US-ljspeech-high.onnx assets/voz
          echo "Audios: $(ls assets/voz/*.mp3 | wc -l), tamaño: $(du -sh assets/voz | cut -f1)"
          test "$(ls assets/voz/*.mp3 | wc -l)" -eq "$(wc -l < frases.tsv)"
      # APK de prueba (firmado con clave de depuración) para instalar en el teléfono.
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk AprendeJugando.apk
      # Archivo para subir a Google Play (.aab): firmado con tu clave de subida y
      # con los anuncios reales. Solo se crea si los secretos de la clave están
      # guardados en GitHub (Settings → Secrets and variables → Actions).
      # El número de compilación sube solo, porque Google Play exige uno nuevo en cada subida.
      - name: AAB para Google Play
        id: aab
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No hay clave de subida guardada en GitHub: no se crea el archivo para Google Play."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties
          flutter build appbundle --release --dart-define=PLAY_RELEASE=true --build-number=${{ github.run_number }}
          mv build/app/outputs/bundle/release/app-release.aab AprendeJugando-GooglePlay.aab
          rm android/key.properties android/app/upload-keystore.jks
          echo "built=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: aprende-jugando-apk
          path: |
            AprendeJugando.apk
            AprendeJugando-GooglePlay.aab
          if-no-files-found: ignore
      # En la rama principal, publica el APK como versión descargable:
      # https://github.com/VL4N/Infantil/releases/latest
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Versión de prueba ${{ github.run_number }}
          body: |
            APK de prueba para instalar en un teléfono Android.
            Descarga **AprendeJugando.apk** y ábrelo en el teléfono (permite "instalar apps de origen desconocido").
            **AprendeJugando-GooglePlay.aab** (si aparece) es el archivo para subir a Google Play Console; no se instala en el teléfono.
          files: |
            AprendeJugando.apk
            AprendeJugando-GooglePlay.aab
          make_latest: true
      # Deja solo la versión recién publicada: borra las anteriores para no confundir.
      - if: github.ref == 'refs/heads/main'
        name: Borrar versiones de prueba anteriores
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep '^build-' | grep -vx "build-${{ github.run_number }}" \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
